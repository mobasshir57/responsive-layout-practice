<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        *{
            margin: 1px;
        }
        .container{
            display: grid;
            gap: 3px;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 125px);
        }
        img{
            width: 100%;
            height: 100%;
        }
        .big-container{
            grid-column: span 6;
            grid-row: span 2;
        }
        .mid-container{
            grid-column: span 2;
            grid-row: span 2;
        }
        .wid-container{
            grid-column: span 2;
            grid-row: span 1;
        }
        .small{
            grid-column: span 1;
            grid-row: span 1;
        }
        @media screen and (max-width:576px) {
            .container{
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }
            .big-container,
            .mid-container,
            .wid-container,
            .small{
                grid-row: span 1;
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="big-container">
            <img src="images/A.jpg" alt="">
        </div>
        <div class="mid-container">
            <img src="images/B.jpg" alt="">
        </div>
        <div class="mid-container">
            <img src="images/C.jpg" alt="">
        </div>
        <div class="wid-container">
            <img src="images/D.jpg" alt="">
        </div>
        <div class="wid-container">
            <img src="images/E.jpg" alt="">
        </div>
        <div class="mid-container">
            <img src="images/F.jpg" alt="">
        </div>
        <div class="small">
            <img src="images/G.jpg" alt="">
        </div>
        <div class="small">
            <img src="images/G.jpg" alt="">
        </div>
        
        <div class="mid-container">
            <img src="images/I.jpg" alt="">
        </div>
        <div class="small">
            <img src="images/G.jpg" alt="">
        </div>
         <div class="small">
            <img src="images/G.jpg" alt="">
        </div>
    </div>
</body>

</html>
